:#4e3a29}.chip.danger{color:#ffd2da;background:#563241}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;min-width:0;display:flex;flex-direction:column;gap:12px}.tile h3{margin:0;font-size:16px}.tile p{font-size:12px;color:#a5b5cc;margin:2px 0 0;line-height:1.55}.app-icon{height:49px;width:49px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(140deg,var(--tone,#6b83cd),#1a2743);font-size:25px;font-weight:900;flex-shrink:0}.app-top{display:flex;gap:12px;align-items:center}.tile .flex-actions{margin-top:auto}.note{border:1px solid #384b63;background:#152b3d;border-radius:13px;padding:14px 16px;font-size:12px;color:#c3d5e9;line-height:1.65}.note strong{color:#f2f4ff}.note.warning{border-color:#5b4634;background:#332d2c;color:#ead7c1}.note.good{border-color:#326657;background:#193a39;color:#caf4e8}.note a{color:#d4c8ff}.empty{padding:26px;text-align:center;color:#97a9c2;border:1px dashed #3b4b66;border-radius:12px;font-size:12px}.rowleft{display:flex;gap:10px;align-items:center;min-width:0}.icon-square{height:38px;min-width:38px;border-radius:10px;display:grid;place-items:center;background:#2b2c55;color:#c4b4ff;font-size:20px}.section-heading{font-size:12px;color:#bccde5;letter-spacing:.08em;text-transform:uppercase;font-weight:800;margin:22px 0 12px}.form-layout{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.span{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#bfd0e4}.field input,.field select,.field textarea{width:100%;border:1px solid #45536e;background:#0d192b;color:#f0f3ff;border-radius:9px;padding:11px 12px;min-height:41px}.field textarea{min-height:81px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:6px}.day{padding:7px 9px;border:1px solid #44546c;border-radius:7px;font-size:11px;display:flex;gap:4px;align-items:center}.day:has(input:checked){bord <body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">✳</span><div><strong>HOLIDAY</strong><small>LIGHT STUDIO · iPAD</small></div></div><div class="navlabel">COMMAND CENTER</div><nav class="nav" id="nav">
<button class="nav-btn active" data-page="home"><i>⌂</i> Dashboard</button><button class="nav-btn" data-page="apps"><i>▦</i> Lighting Apps</button><button class="nav-btn" data-page="devices"><i>▤</i> My Lights</button><button class="nav-btn" data-page="scenes"><i>✳</i> Holiday Shows</button><button class="nav-btn" data-page="playlists"><i>♫</i> Music</button><button class="nav-btn" data-page="schedules"><i>◷</i> Schedules</button><button class="nav-btn" data-page="settings"><i>⚙</i> Settings</button></nav><div class="sidebar-bottom"><div class="side-tag">● iPAD STANDALONE MODE</div>All app data stays in this browser on your iPad. No Python server required.</div></aside>
<section class="body"><header class="topbar"><div class="clock" id="clock">Holiday Light Studio</div><div class="topright"><button id="wakeButton" class="wake" type="button" aria-pressed="false"><i></i> Keep Screen Awake: <span id="wakeLabel">OFF</span></button></div></header><main class="content" id="main"></main></section></div>
<div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="backupPicker" accept="application/json,.json" hidden><input type="file" id="audioPicker" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple hidden>
<script>
(() => { 'use strict';
const K='hls_ipad_v2', KW='hls_ipad_wake_v2', DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const APPS=[
 {id:'govee',name:'Govee Home',desc:'Govee smart lights; direct scenes depend on the exact model and manufacturer app.',url:'https://apps.apple.com/us/app/govee-home/id1395696823',tone:'#32b9c7',letter:'G'},
 {id:'lotus',name:'LotusLamp X',desc:'Correct LotusLamp app. Bluetooth devices may require using the manufacturer app.',url:'https://apps.apple.com/us/app/lotuslamp-x/id1581552792',tone:'#9566db',letter:'L'},
 {id:'dazzle',name:'Dazzle Bright',desc:'Manage compatible Dazzle Bright lighting in its own app.',url:'https://apps.apple.com/us/app/dazzle-bright/id6745255157',tone:'#e59476',letter:'D'},
 {id:'hue',name:'Philips Hue',desc:'Hue devices and scenes; Apple Home and Shortcuts capabilities vary by setup.',url:'https://apps.apple.com/us/app/philips-hue/id1055281310',tone:'#efc36b',letter:'H'},
 {id:'wiz',name:'WiZ Connected',desc:'Wi-Fi lighting, app scenes and model-dependent automation options.',url:'https://apps.apple.com/us/app/wiz-connected/id1587655962',tone:'#82b9ec',letter:'W'},
 {id:'brmesh',name:'BRmesh',desc:'Bluetooth-mesh lighting; reliable third-party control is not established.',url:'https://apps.apple.com/us/app/brmesh/id1602345035',tone:'#74d8a7',letter:'B'}];
let state, view='home', wakeWanted=localStorage.getItem(KW)==='1', wakeLock=null, lastFire={}, audioTracks=[], audioIndex=-1;
const $=id=>document.getElementById(id); const uid=()=>((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():('id'+Date.now()+Math.random()));
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=escapeHtml; const safeUrl=u=>/^https:\/\//i.test(String(u||''))?esc(u):'#';
const blank=()=>({version:2,devices:[],scenes:[{id:'christmas-example',name:'Christmas Roofline',holiday:'Christmas',description:'Sample scene - add a Shortcut name to start actual compatible lights.',shortcut:'',playlist:''},{id:'halloween-example',name:'Halloween Glow',holiday:'Halloween',description:'Sample scene - set up compatible lights in their own apps.',shortcut:'',playlist:''}],playlists:[],schedules:[],settings:{appShortcuts:{}}});
try{const saved=JSON.parse(localStorage.getItem(K));state=sanitize(saved);}catch{state=blank();}
function sanitize(data){if(!data||typeof data!=='object'||Array.isArray(data))return blank();let x=blank();for(let name of ['devices','scenes','playlists','schedules'])if(Array.isArray(data[name]))x[name]=data[name].slice(0,200).filter(v=>v&&typeof v==='object'&&!Array.isArray(v));if(data.settings?.appShortcuts&&typeof data.settings.appShortcuts==='object')x.settings.appShortcuts={...data.settings.appShortcuts};return x;}
function persist(){try{localStorage.setItem(K,JSON.stringify(state));}catch{toast('Unable to save on this browser. Please export your backup.',true);}}
function toast(t,isError=false){const el=$('toast');el.textContent=t;el.classList.toggle('error',isError);el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),4800);}
function appName(id){return APPS.find(a=>a.id===id)?.name||'Unknown app';}
function scene(id){return state.scenes.find(s=>s.id===id);}function playlist(id){return state.playlists.find(p=>p.id===id);}
function clock(){const now=new Date();$('clock').textContent=now.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function go(page){view=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'instant'});}
function btn(label,action,cls=''){return `<button type="button" class="btn ${cls}" data-action="${esc(action)}">${esc(label)}</button>`;}
function head(title,description,addType,label){return `<div class="pagehead"><div><div class="kicker">iPad Holiday Command Center</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${addType?btn(label||'Add new',`new:${addType}`,'primary'):''}</div>`;}
function empty(text){return `<div class="empty">${esc(text)}</div>`;}
function summaryItem(title,details,chip=''){return `<div class="item"><div class="itemmain"><strong>${esc(title)}</strong><small>${esc(details)}</small></div>${chip?`<span class="chip">${esc(chip)}</span>`:''}</div>`;}
function renderHome(){let active=state.schedules.filter(s=>s.enabled),next=active.slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('main').innerHTML=`<div class="kicker">YOUR LIGHTING & MUSIC CONTROL CENTER</div><div class="hero"><div class="hero-text"><h1>One iPad.<br>Every holiday.</h1><p>Organize all six lighting apps, make music playlists, plan shows, and open your own Apple Shortcuts. No separate server required.</p><div class="flex-actions">${btn('＋ Create holiday show','new:scenes','primary')}${btn('Open lighting apps','page:apps')}${btn('Music library','page:playlists')}</div></div><div class="bulbs"><span></span><span></span><span></span><span></span></div></div><div class="metrics"><div class="metric"><span>Lighting brands</span><strong>6</strong><small>App directory</small></div><div class="metric"><span>Devices listed</span><strong>${state.devices.length}</strong><small>Organized on this iPad</small></div><div class="metric"><span>Holiday shows</span><strong>${state.scenes.length}</strong><small>Shortcuts optional</small></div><div class="metric"><span>Active reminders</span><strong>${active.length}</strong><small>While this app is visible</small></div></div><div class="columns"><section class="panel"><div class="panel-head"><h2>Upcoming schedule reminders</h2><button data-page="schedules">Manage →</button></div><div class="items">${next.length?next.slice(0,5).map(s=>summaryItem(s.name,`${(s.days||[]).map(d=>DAYS[d]).join(' · ')} · ${scene(s.scene)?.name||'No scene'}`,s.time)).join(''):empty('Create a reminder schedule. The iPad must keep the web app open for in-app alerts.')}</div></section><section class="panel"><div class="panel-head"><h2>Your holiday shows</h2><button data-page="scenes">All shows →</button></div><div class="items">${state.scenes.slice(0,4).map(s=>summaryItem(s.name,s.description||s.holiday,s.shortcut?'Shortcut linked':'Manual setup')).join('')||empty('No shows yet.')}</div></section></div><div class="note warning" style="margin-top:16px"><strong>Important:</strong> This is an organizer and manual Shortcut launcher. It does not directly pair with Bluetooth lights, control the six manufacturers simultaneously, or run in-browser schedules when iPadOS suspends it. For unattended operation, configure supported actions in Apple Shortcuts or a manufacturer app.</div>`;}
function renderApps(){$('main').innerHTML=head('Lighting Apps','Six brands in one directory. App Store links let you install or locate their iPad-compatible apps; you can also link a custom Shortcut launcher.')+`<div class="grid">${APPS.map(a=>`<article class="tile"><div class="app-top"><span class="app-icon" style="--tone:${a.tone}">${a.letter}</span><div><h3>${esc(a.name)}</h3><p>Lighting app</p></div></div><p>${esc(a.desc)}</p><div class="flex-actions"><a class="btn small primary" href="${safeUrl(a.url)}" target="_blank" rel="noopener">App Store ↗</a>${state.settings.appShortcuts[a.id]?`<button class="btn small" data-action="runShortcut:${esc(state.settings.appShortcuts[a.id])}">Run Shortcut</button>`:''}<button class="btn small ghost" data-action="appShortcut:${a.id}">Set Shortcut</button></div></article>`).join('')}</div><div class="note" style="margin-top:18px">A web app cannot embed the other six apps inside itself or independently control their Bluetooth devices. A linked Apple Shortcut can open an installed app or run actions that the manufacturer explicitly supports.</div>`;}
function renderDevices(){$('main').innerHTML=head('My Lights','Catalog your lights by brand and location. Add an optional Shortcut name only if you have made a working Shortcut.', 'devices','＋ Add light')+`<section class="panel"><div class="items">${state.devices.length?state.devices.map(d=>`<div class="item"><div class="rowleft"><span class="icon-square">✳</span><div class="itemmain"><strong>${esc(d.name)}</strong><small>${esc(appName(d.app))} · ${esc(d.zone||'Unassigned')} · ${esc(d.model||'Model unknown')}</small></div></div><div class="flex-actions">${d.shortcut?btn('Run Shortcut',`runShortcut:${d.shortcut}`,'small'):''}${btn('Edit',`edit:devices:${d.id}`,'small')}${btn('Delete',`delete:devices:${d.id}`,'small ghost')}</div></div>`).join(''):empty('No lights listed. Add your roofline, trees, floodlights, or other fixtures.')}</div></section>`;}
function renderScenes(){$('main').innerHTML=head('Holiday Shows','Prepare scenes for each holiday; associate music and an optional Apple Shortcut.', 'scenes','＋ New show')+`<div class="grid">${state.scenes.map(s=>`<article class="tile"><div class="kicker">${esc(s.holiday||'Custom')}</div><h3>${esc(s.name)}</h3><p>${esc(s.description||'No details yet')}</p><div class="smallcopy">${s.shortcut?`Shortcut: ${esc(s.shortcut)}`:'No Shortcut linked — manual organizer mode'}</div><div class="smallcopy">Music: ${esc(playlist(s.playlist)?.name||'None attached')}</div><div class="flex-actions">${btn('▶ Start',`start:${s.id}`,'primary small')}${btn('Edit',`edit:scenes:${s.id}`,'small')}${btn('Delete',`delete:scenes:${s.id}`,'small ghost')}</div></article>`).join('')||empty('No shows yet. Create a Christmas, Halloween, or other holiday show.')}</div><div class="note" style="margin-top:16px"><strong>Start</strong> opens the named Apple Shortcut (when supplied) and offers the saved music link. You must create the actual Shortcut actions on the iPad. Without a working Shortcut, starting a scene is a checklist, not a light command.</div>`;}
function renderPlaylists(){$('main').innerHTML=head('Music Playlists','Save links to Apple Music, Spotify, YouTube Music, or other HTTPS playlists. Optionally audition audio files from the iPad Files app.', 'playlists','＋ Add playlist')+`<div class="columns"><div class="panel"><h2>Saved playlists</h2><div class="items">${state.playlists.length?state.playlists.map(p=>`<div class="item"><div class="itemmain"><strong>${esc(p.name)}</strong><small>${esc(p.holiday||'All holidays')} · ${esc(p.note||p.url||'')}</small></div><div class="flex-actions">${p.url?`<a class="btn small primary" href="${safeUrl(p.url)}" target="_blank" rel="noopener">Open ↗</a>`:''}${btn('Edit',`edit:playlists:${p.id}`,'small')}${btn('Delete',`delete:playlists:${p.id}`,'small ghost')}</div></div>`).join(''):empty('No playlists saved. Add a streaming playlist URL.')}</div></div><div class="panel audio-panel"><h2>Play music files from this iPad</h2><p class="smallcopy">Choose MP3/M4A and other supported audio from Files to listen here while the app is active. These selected files are temporary and must be reselected after closing or refreshing.</p><button class="btn primary" data-action="chooseAudio">＋ Choose audio files</button><audio id="audioPlayer" controls preload="metadata"></audio><div class="flex-actions">${btn('◀ Previous','audioPrev','small')}${btn('Next ▶','audioNext','small')}${btn('Clear files','audioClear','small ghost')}</div><div class="tracklist">${audioTracks.length?audioTracks.map((t,i)=>`<div class="trackrow"><span>${i===audioIndex?'♫ ':''}${esc(t.name)}</span><button class="btn small" data-action="audioPlay:${i}">Play</button></div>`).join(''):empty('No local files selected.')}</div></div></div><div class="note warning" style="margin-top:16px">Streaming services control authentication and playback. Opening a playlist does not automatically synchronize its beats with lighting effects. Audio may stop when you switch apps or when iPadOS suspends this page.</div>`;}
function renderSchedules(){$('main').innerHTML=head('Schedule Planner','Set repeating reminders here and optionally create matching real Time of Day automations in Apple Shortcuts.', 'schedules','＋ Add schedule')+`<div class="note warning" style="margin-bottom:16px"><strong>Two different schedule types:</strong> In-app reminders appear only when this dashboard is open and visible. Native Shortcuts automations are created separately on the iPad; checking “native configured” here is just your own record, not an automatic setup.</div><section class="panel"><div class="items">${state.schedules.length?state.schedules.slice().sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(s=>`<div class="item"><div style="font-size:23px;font-weight:850;min-width:72px">${esc(s.time)}</div><div class="itemmain"><strong>${esc(s.name)}</strong><small>${(s.days||[]).map(d=>DAYS[d]).join(' · ')} · ${esc(scene(s.scene)?.name||'No show')} · ${s.native?'Native Shortcut recorded':'In-app reminder only'}</small></div><div class="flex-actions"><span class="chip ${s.enabled?'good':'warn'}">${s.enabled?'Reminder on':'Paused'}</span>${btn(s.enabled?'Pause':'Enable',`toggle:${s.id}`,'small')}${btn('How to automate',`how:${s.id}`,'small')}${btn('Edit',`edit:schedules:${s.id}`,'small')}${btn('Delete',`delete:schedules:${s.id}`,'small ghost')}</div></div>`).join(''):empty('No schedules yet. Add a time and weekdays to get visible on-screen reminders.')}</div></section><div class="section-heading">iPad scheduling options</div><div class="columns"><div class="note"><strong>While this app is open</strong><p>The dashboard checks the local time periodically. When a reminder is due, it shows an alert with a button to start the associated show.</p></div><div class="note"><strong>While the iPad is locked</strong><p>Use Apple Shortcuts → Automation → Time of Day → Run Immediately (where available) and a valid light-control action provided by the compatible manufacturer or Home setup.</p></div></div>`;}
function renderSettings(){$('main').innerHTML=head('iPad Setup & Settings','Manage backups, screen-awake behavior, and the limits of a browser-only solution.')+`<div class="columns"><section class="panel"><h2>Keep the iPad awake</h2><div class="stack"><div class="note"><strong>Wake status:</strong> <span id="settingsWake">${wakeLock?'ACTIVE':wakeWanted?'REQUESTED (not guaranteed)':'OFF'}</span><p>Screen Wake Lock works on supported Safari versions on HTTPS while the page is visible. It is released when you leave the page and can be denied by iPadOS.</p></div><div class="flex-actions"><button class="btn primary" id="settingsWakeToggle">${wakeWanted?'Turn off wake mode':'Turn on wake mode'}</button></div><p class="smallcopy">Alternative: iPad Settings → Display & Brightness → Auto-Lock (choose the longest permitted setting, or Never if offered). Plug in your iPad during shows. Auto-Lock changes are systemwide; this app cannot change them automatically.</p></div></section><section class="panel"><h2>Your data and backups</h2><p class="smallcopy">Saved locally in this iPad's browser storage, not in a cloud account. Export your data before clearing Safari website data or changing iPads.</p><div class="flex-actions">${btn('↓ Export JSON backup','export','primary')}${btn('↑ Import backup','import')}${btn('Delete all data','reset','danger')}</div></section></div><div class="section-heading">Install and automate</div><div class="grid"><section class="panel"><h2>1 · Install from Safari</h2><p class="smallcopy">Upload the supplied files to a secure static website such as GitHub Pages. In Safari, open the HTTPS website, tap Share → Add to Home Screen → Open as Web App → Add.</p></section><section class="panel"><h2>2 · Link Apple Shortcuts</h2><p class="smallcopy">Create an Apple Shortcut named, for example, <span class="kbd">Christmas Roofline</span>. Add supported manufacturer actions, or use Open App for a launcher. Type the exact Shortcut name into a show or lighting app entry.</p></section><section class="panel"><h2>3 · Set real automation</h2><p class="smallcopy">For compatible actions, go to Shortcuts → Automation → Time of Day. Choose weekdays and Run Immediately if supported. Add Run Shortcut → your configured Shortcut. Test on the actual devices.</p></section></div><div class="section-heading">Manufacturer & platform references</div><div class="quicklinks"><a class="quicklink" href="https://support.apple.com/guide/shortcuts/welcome/ios" target="_blank" rel="noopener">Apple Shortcuts User Guide ↗</a><a class="quicklink" href="https://support.apple.com/guide/ipad/turn-a-website-into-an-app-ipad8f1f7a29/ipados" target="_blank" rel="noopener">Apple: Add website to Home Screen ↗</a><a class="quicklink" href="https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API" target="_blank" rel="noopener">Screen Wake Lock specification ↗</a><a class="quicklink" href="https://docs.github.com/en/pages/quickstart" target="_blank" rel="noopener">GitHub Pages deployment ↗</a></div><p class="footer">Holiday Light Studio · iPad Edition 2.0 · Privacy: local device storage only · No remote-control credentials collected.</p>`;}
function render(){if(view==='home')renderHome();if(view==='apps')renderApps();if(view==='devices')renderDevices();if(view==='scenes')renderScenes();if(view==='playlists')renderPlaylists();if(view==='schedules')renderSchedules();if(view==='settings')renderSettings();}
const labelField=(name,label,value='',type='text',attrs='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`;
const selectField=(name,label,options,selected)=>`<div class="field"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const optionApps=()=>APPS.map(a=>[a.id,a.name]);
function showModal(title,body,ok,onSubmit){$('modalRoot').innerHTML=`<div class="modal-wrap" id="dialogOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><header><h2 id="dialogTitle">${esc(title)}</h2><button class="mini-close" type="button" data-close>✕</button></header><form id="dialogForm">${body}<footer><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit">${esc(ok||'Save')}</button></footer></form></div></div>`;const form=$('dialogForm');form.addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(form),obj=Object.fromEntries(fd.entries());if(onSubmit(obj,form)!==false){closeModal();persist();render();}});}
function closeModal(){$('modalRoot').innerHTML='';}
function newOrEdit(type,id){let item=(state[type]||[]).find(x=>x.id===id)||{},isEdit=!!id;let body='';let base=labelField('name','Name',item.name||'','text','required maxlength="90"');if(type==='devices'){body=`<div class="form-layout">${base}${selectField('app','Lighting app',optionApps(),item.app||'govee')}${labelField('zone','Location / zone',item.zone||'')}${labelField('model','Model (optional)',item.model||'')}${labelField('shortcut','Working Apple Shortcut name (optional)',item.shortcut||'')}</div>`;}
if(type==='scenes'){body=`<div class="form-layout">${base}${selectField('holiday','Holiday',[['Christmas','Christmas'],['Halloween','Halloween'],['Patriotic','Patriotic'],['Easter','Easter'],['New Year','New Year'],['Custom','Custom']],item.holiday||'Christmas')}${labelField('shortcut','Existing Apple Shortcut name (optional)',item.shortcut||'')}${selectField('playlist','Music playlist',[['','None'],...state.playlists.map(p=>[p.id,p.name])],item.playlist||'')}<div class="field span"><label for="f_description">Show notes</label><textarea name="description" id="f_description" maxlength="800">${esc(item.description||'')}</textarea></div></div>`;}
if(type==='playlists'){body=`<div class="form-layout">${base}${labelField('holiday','Holiday / theme',item.holiday||'Christmas')}${labelField('url','HTTPS playlist link',item.url||'','url','placeholder="https://..."')}${labelField('note','Notes (optional)',item.note||'')}</div>`;}
if(type==='schedules'){body=`<div class="form-layout">${base}${labelField('time','Local start time',item.time||'18:00','time','required')}${selectField('scene','Associated show',[['','Select a show'],...state.scenes.map(s=>[s.id,s.name])],item.scene||'')}<div class="field span"><label>Repeat on these days</label><div class="checks">${DAYS.map((d,i)=>`<label class="day"><input type="checkbox" name="days" value="${i}" ${(item.days||[0,1,2,3,4,5,6]).includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="field span"><label class="day"><input type="checkbox" name="enabled" ${item.enabled!==false?'checked':''}>Show reminders when dashboard is open</label></div><div class="field span"><label class="day"><input type="checkbox" name="native" ${item.native?'checked':''}>I have separately configured and tested this in Apple Shortcuts</label></div></div>`;}
showModal(isEdit?'Edit '+type.slice(0,-1):'New '+type.slice(0,-1),body,'Save', (data,form)=>{data.name=data.name.trim();if(!data.name){toast('Enter a name.',true);return false;}if(type==='playlists'&&data.url&&!/^https:\/\//i.test(data.url)){toast('Use a valid HTTPS playlist URL.',true);return false;}if(type==='schedules'){data.days=[...form.querySelectorAll('input[name="days"]:checked')].map(x=>Number(x.value));data.enabled=!!form.querySelector('input[name="enabled"]:checked');data.native=!!form.querySelector('input[name="native"]:checked');if(!data.days.length){toast('Select at least one day.',true);return false;}}let next={...item,...data,id:item.id||uid()};if(isEdit){state[type]=state[type].map(x=>x.id===id?next:x);}else state[type].push(next);toast('Saved on this iPad.');return true;});}
function deleteItem(type,id){let i=state[type].find(x=>x.id===id);if(!i)return;if(confirm('Delete "'+i.name+'"?')){state[type]=state[type].filter(x=>x.id!==id);persist();render();toast('Deleted.');}}
function launchShortcut(name){let value=String(name||'').trim();if(!value){toast('No Shortcut configured for this item.',true);return;}window.location.href='shortcuts://run-shortcut?name='+encodeURIComponent(value);toast('Opening the Apple Shortcuts app. If nothing happens, check the exact Shortcut name.');}
function openScene(id){const s=scene(id);if(!s)return;let music=playlist(s.playlist);let body=`<div class="note"><strong>Holiday show:</strong> ${esc(s.name)}<p>${esc(s.description||'')}</p></div><p>${s.shortcut?`A Shortcut named <strong>${esc(s.shortcut)}</strong> is linked. It only performs the actions you configured in Apple's Shortcuts app.`:'No Apple Shortcut is linked. Start your individual lighting apps manually.'}</p>${music?`<div class="note">Linked playlist: <strong>${esc(music.name)}</strong> ${music.url?`<a href="${safeUrl(music.url)}" target="_blank" rel="noopener">Open playlist ↗</a>`:''}</div>`:''}<div class="flex-actions" style="margin-top:16px">${s.shortcut?`<button type="button" class="btn primary" data-action="runShortcut:${esc(s.shortcut)}">Run Shortcut</button>`:''}<button type="button" class="btn" data-action="page:apps">Lighting apps</button></div>`;
$('modalRoot').innerHTML=`<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true"><header><h2>Start: ${esc(s.name)}</h2><button class="mini-close" data-close>✕</button></header>${body}<footer><button class="btn" data-close>Close</button></footer></div></div>`;}
function scheduleHow(id){const s=state.schedules.find(a=>a.id===id);if(!s)return;const name=scene(s.scene)?.shortcut||'';const text=`Time: ${s.time}; Days: ${(s.days||[]).map(d=>DAYS[d]).join(', ')}; ${name?'Run Apple Shortcut: '+name:'Create a working Shortcut for '+(scene(s.scene)?.name||'your show')}`;
$('modalRoot').innerHTML=`<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true"><header><h2>Set up native automation</h2><button class="mini-close" data-close>✕</button></header><p><strong>${esc(s.name)}</strong> — ${esc(text)}</p><ol><li>Open the Apple <strong>Shortcuts</strong> app on your iPad.</li><li>Go to <strong>Automation</strong>, then create a <strong>Time of Day</strong> automation.</li><li>Choose <strong>${esc(s.time)}</strong> and the requested weekdays; choose <strong>Run Immediately</strong> if available.</li><li>Add the <strong>Run Shortcut</strong> action, selecting the Shortcut that really controls your compatible light(s).</li><li>Save, test the automation, and only then mark “native configured” here.</li></ol><div class="note warning">Creating a schedule here does <strong>not</strong> create the Shortcuts automation for you. If an app offers no automation action, opening that app may still require manual control.</div><footer><button class="btn" data-action="copy:${esc(id)}">Copy schedule details</button><button class="btn primary" data-close>Done</button></footer></div></div>`;}
function appShortcut(id){let a=APPS.find(a=>a.id===id);if(!a)return;showModal('Link Shortcut · '+a.name,`<p>Type the exact name of a Shortcut you have created on this iPad. The app cannot create manufacturer actions automatically.</p>${labelField('shortcut','Apple Shortcut name',state.settings.appShortcuts[id]||'')}`,'Save',data=>{state.settings.appShortcuts[id]=(data.shortcut||'').trim();toast('Shortcut link saved.');return true;});}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='holiday-light-studio-ipad-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup download requested. Check Files → Downloads.');}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{let val=JSON.parse(r.result);if(!val||!Array.isArray(val.scenes)||!Array.isArray(val.devices)||!Array.isArray(val.playlists)||!Array.isArray(val.schedules))throw Error('Invalid backup structure.');if(!confirm('Replace the current data on this iPad with the imported backup?'))return;state=sanitize(val);persist();render();toast('Backup restored.');}catch(e){toast('Import failed: '+e.message,true);}};r.readAsText(file);}
async function wakeToggle(){wakeWanted=!wakeWanted;localStorage.setItem(KW,wakeWanted?'1':'0');if(!wakeWanted){if(wakeLock){await wakeLock.release().catch(()=>{});wakeLock=null;}}else await requestWake();updateWake();}
async function requestWake(){if(!wakeWanted||document.visibilityState!=='visible')return;if(!('wakeLock' in navigator)){wakeLock=null;return;}try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;updateWake();});}catch(err){wakeLock=null;}}
function updateWake(){let status=!wakeWanted?'OFF':wakeLock?'ON':'ARMED';let el=$('wakeButton');el.className='wake'+(wakeLock?' on':wakeWanted?' armed':'');el.setAttribute('aria-pressed',wakeWanted?'true':'false');$('wakeLabel').textContent=status;let s=$('settingsWake');if(s)s.textContent=status==='ON'?'ACTIVE — while visible':status==='ARMED'?'REQUESTED — browser denied or not visible':'OFF';}
function clearAudio(){for(const track of audioTracks)URL.revokeObjectURL(track.url);audioTracks=[];audioIndex=-1;let p=$('audioPlayer');if(p){p.pause();p.removeAttribute('src');p.load();}render();}
function playAudio(i){if(i<0||i>=audioTracks.length)return;audioIndex=i;render();let player=$('audioPlayer');player.src=audioTracks[i].url;player.play().catch(()=>toast('Tap Play in the audio controls to start audio.',true));player.onended=()=>{if(audioIndex+1<audioTracks.length)playAudio(audioIndex+1);};}
function audioAdd(files){let newFiles=[...files].filter(f=>/^(audio\/|.*\.(mp3|m4a|wav|aac|flac)$)/i.test(f.type||f.name));if(!newFiles.length){toast('Select audio files from Files.',true);return;}audioTracks.push(...newFiles.map(f=>({name:f.name,url:URL.createObjectURL(f)})));render();toast('Audio loaded temporarily on this iPad.');}
function remind(){if(document.visibilityState!=='visible')return;let now=new Date(),date=[now.getFullYear(),now.getMonth()+1,now.getDate()].join('-'),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');for(let s of state.schedules){if(!s.enabled||!Array.isArray(s.days)||!s.days.includes(now.getDay())||s.time!==time)continue;let key=s.id+':'+date+':'+time;if(lastFire[key])continue;lastFire[key]=true;toast('Schedule reminder: '+s.name);let target=scene(s.scene);if(target)openScene(target.id);}}
// Delegated events keep dynamically rendered controls functional.
document.addEventListener('click',async e=>{const page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return;}const closer=e.target.closest('[data-close]');if(closer){closeModal();return;}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,parts=action.split(':');if(parts[0]==='page'){closeModal();go(parts[1]);}else if(parts[0]==='new')newOrEdit(parts[1]);else if(parts[0]==='edit')newOrEdit(parts[1],parts.slice(2).join(':'));else if(parts[0]==='delete')deleteItem(parts[1],parts.slice(2).join(':'));else if(parts[0]==='toggle'){const s=state.schedules.find(x=>x.id===parts[1]);if(s){s.enabled=!s.enabled;persist();render();}}else if(parts[0]==='how')scheduleHow(parts[1]);else if(parts[0]==='start')openScene(parts[1]);else if(parts[0]==='runShortcut')launchShortcut(action.slice('runShortcut:'.length));else if(parts[0]==='appShortcut')appShortcut(parts[1]);else if(action==='export')exportData();else if(action==='import')$('backupPicker').click();else if(action==='reset'){if(confirm('Erase all your Holiday Light Studio data on this iPad? Export a backup first.')){state=blank();persist();render();toast('Data reset.');}}else if(action==='chooseAudio')$('audioPicker').click();else if(action==='audioClear')clearAudio();else if(action==='audioPrev')playAudio(Math.max(0,audioIndex-1));else if(action==='audioNext')playAudio(Math.min(audioTracks.length-1,audioIndex+1));else if(parts[0]==='audioPlay')playAudio(Number(parts[1]));else if(parts[0]==='copy'){let s=state.schedules.find(x=>x.id===parts[1]);if(s){let str=`${s.name} ${s.time} ${s.days.map(d=>DAYS[d]).join(',')} ${scene(s.scene)?.shortcut||''}`;try{await navigator.clipboard.writeText(str);toast('Copied schedule details.');}catch{toast('Clipboard not available.',true);}}}});
$('backupPicker').addEventListener('change',e=>{importData(e.target.files?.[0]);e.target.value='';});$('audioPicker').addEventListener('change',e=>{audioAdd(e.target.files||[]);e.target.value='';});
$('wakeButton').addEventListener('click',wakeToggle);document.addEventListener('click',e=>{if(e.target.id==='settingsWakeToggle')wakeToggle();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(wakeWanted)requestWake();remind();}updateWake();});
clock();render();updateWake();setInterval(()=>{clock();remind();},15000);if(wakeWanted&&document.visibilityState==='visible')requestWake();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
